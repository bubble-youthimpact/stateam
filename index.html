<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>Stateam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app column, sticky header, fixed bottom tab bar; cards only for grouped data */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#eceff5; --line:#dce1ea;
  --fg:#0c1220; --muted:#5a6477; --accent:#2557d6; --accent-fg:#ffffff;
  --accent-soft:rgba(37,87,214,.10); --good:#17855a; --good-soft:rgba(23,133,90,.12);
  --star:#f5a623; --gold:#a8740a; --gold-soft:rgba(214,158,30,.14); --coach:#0c7f70; --coach-soft:rgba(12,127,112,.12); --bad:#c23a45; --bad-soft:rgba(194,58,69,.10); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12);
  --shadow:0 1px 2px rgba(12,18,32,.06),0 8px 24px rgba(12,18,32,.06);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06080d; --surface:#10141c; --surface2:#171c27; --line:#242b38;
  --fg:#edf1f8; --muted:#8a94a7; --accent:#3a74f2; --accent-fg:#ffffff;
  --accent-soft:rgba(58,116,242,.16); --good:#4cc38a; --good-soft:rgba(76,195,138,.14);
  --star:#f7b733; --gold:#f2c14e; --gold-soft:rgba(242,193,78,.13); --coach:#3dc6b1; --coach-soft:rgba(61,198,177,.15); --bad:#f06b74; --bad-soft:rgba(240,107,116,.14); --warn:#e5ac3d; --warn-soft:rgba(229,172,61,.14);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06080d; --surface:#10141c; --surface2:#171c27; --line:#242b38;
  --fg:#edf1f8; --muted:#8a94a7; --accent:#3a74f2; --accent-fg:#ffffff;
  --accent-soft:rgba(58,116,242,.16); --good:#4cc38a; --good-soft:rgba(76,195,138,.14);
  --star:#f7b733; --gold:#f2c14e; --gold-soft:rgba(242,193,78,.13); --coach:#3dc6b1; --coach-soft:rgba(61,198,177,.15); --bad:#f06b74; --bad-soft:rgba(240,107,116,.14); --warn:#e5ac3d; --warn-soft:rgba(229,172,61,.14);
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 112px;min-height:100vh}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand svg{color:var(--accent)}
.brand b{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
h1{font-size:26px;line-height:1.15;letter-spacing:-.03em;margin:14px 0 4px;text-wrap:balance;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px}
h2{font-size:17px;letter-spacing:-.01em;margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);outline:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .lab svg{color:var(--accent)}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}

.chart svg{display:block;width:100%;height:auto}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.charthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
select.mini{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:13px}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .r b{font-size:17px;font-variant-numeric:tabular-nums}
.row .r b small{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
.glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.glyph.prac{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.pill.W{background:var(--good-soft);color:var(--good)}
.pill.L{background:var(--bad-soft);color:var(--bad)}
.pill.D{background:var(--surface2);color:var(--muted)}
.pill.P{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--surface2);color:var(--muted)}
.pill.a{background:var(--accent-soft);color:var(--accent)}

.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{padding:12px}
.pr .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pr .d{font-size:12px;color:var(--muted)}

.team{padding:16px;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%}
.team:hover{border-color:var(--accent)}
.team .glyph{width:48px;height:48px;border-radius:13px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px}
.logo.lg{width:52px;height:52px;flex:0 0 auto}
.srow{grid-template-columns:48px 1fr 18px;padding:12px 14px;gap:14px}
.srow .sname{font-weight:700;font-size:15px;line-height:1.3;text-wrap:balance}
.srow .chev{color:var(--muted)}
.srow:hover .chev{color:var(--accent)}
.prow{display:grid;grid-template-columns:1fr auto;align-items:center;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pbtn{display:grid;grid-template-columns:32px 1fr 16px;gap:12px;align-items:center;padding:11px 16px;background:none;border:0;text-align:left;cursor:pointer;width:100%}
.pbtn:hover{background:var(--surface2)}
.pbtn .t{font-weight:600}
.pbtn .m{color:var(--muted);font-size:12px}
.chip.sm{padding:6px 12px;font-size:13px}
.lbrow{grid-template-columns:30px 1fr auto}
.lbrow:disabled{cursor:default}
.lbrow.me{background:var(--accent-soft)}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface2);color:var(--muted);font-variant-numeric:tabular-nums}
.rank.r1{background:var(--accent);color:var(--accent-fg)}
.rank.r2{background:color-mix(in srgb,var(--accent) 55%,var(--surface2));color:var(--accent-fg)}
.rank.r3{background:color-mix(in srgb,var(--accent) 30%,var(--surface2));color:var(--fg)}
.av.sm{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:22px;font-weight:800;flex:0 0 auto}
.avgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.avgs b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.avgs span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.backlink{display:inline-flex;margin:-4px 0 6px}
.auth{max-width:420px;margin:0 auto;padding-inline:16px;padding-block:36px 48px;display:flex;flex-direction:column;gap:18px}
.auth h1{font-size:30px;margin:0}
.authbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:24px;letter-spacing:-.03em}
.authbrand svg{color:var(--accent)}
.gbtn{background:var(--surface);gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolecard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;min-width:0}
.rolecard .ri{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--muted);margin-bottom:6px}
.rolecard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rolecard[aria-pressed="true"] .ri{background:var(--accent);color:var(--accent-fg)}
.pwrap{position:relative}
.pwrap input{padding-right:64px}
.pwrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.okmsg{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.notice{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.btn:disabled{opacity:.6;cursor:default}
.agree{margin-block:8px;display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--muted);cursor:pointer}
.agree input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.agree a{color:var(--accent);font-weight:600}
.arow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .t{font-weight:700}.arow .m{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.aact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.offtag{color:var(--coach);font-weight:700}
.crow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}.crow .t{font-weight:700}
.rmzone{display:flex;align-items:center;gap:10px;padding-right:14px;flex-wrap:wrap;justify-content:flex-end}
.rmzone.confirming{grid-column:1/-1;padding:0 14px 12px 16px;background:var(--bad-soft);padding-top:10px}
html.modal-open,html.modal-open body{overflow:hidden;overscroll-behavior:none}
.sheet{overscroll-behavior:contain}
.scrim{overscroll-behavior:contain}
.errbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.errbtns .btn{color:var(--fg)}
.errbtns .btn.go{color:var(--accent)}
.pbtn .pill{margin-left:8px;vertical-align:1px}
.confirmbox{display:flex;flex-direction:column;gap:6px;background:var(--bad-soft);border-radius:var(--r);padding:14px}
.confirmbox .actions{margin-top:6px}
.avatars{display:flex}
.avatars span{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:2px solid var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center;margin-left:-6px}
.avatars span:first-child{margin-left:0}

.ach{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:16px;align-items:start}
.ach .glyph{width:48px;height:48px;border-radius:13px;background:var(--surface2);color:var(--muted)}
.ach.done{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:linear-gradient(135deg,var(--accent-soft),transparent 70%),var(--surface)}
.ach.done .glyph{background:var(--accent);color:var(--accent-fg);position:relative}
.ach.done .glyph::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.pill.earned{background:var(--accent);color:var(--accent-fg)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.callout{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.callout svg{color:var(--accent)}

.profile-hero{overflow:hidden}
.profile-hero .cover{height:84px;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#0b1a3d))}
.profile-hero .av{width:76px;height:76px;border-radius:50%;background:var(--surface2);border:4px solid var(--surface);display:grid;place-items:center;font-size:24px;font-weight:800;margin-top:-38px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.trio div b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(4,7,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:560px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheethead h2{font-size:20px}
form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:46px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.rating{display:flex;align-items:center;gap:4px}
.rating button{border:0;background:none;padding:4px;cursor:pointer;color:var(--line);line-height:0;border-radius:8px;transition:transform .12s}
.rating button:hover{transform:scale(1.1)}
.rating button.on{color:var(--star)}
.rating .rlab{margin-left:8px;font-size:14px;font-weight:600;color:var(--muted)}
.stars{display:inline-flex;gap:1px;color:var(--line)}
.stars .on{color:var(--star)}
@media (prefers-reduced-motion:reduce){.rating button{transition:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:20px;letter-spacing:.12em;user-select:all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
.pill.coach{background:var(--coach-soft);color:var(--coach)}
.pill.off{background:var(--coach-soft);color:var(--coach)}
.glyph.off{background:var(--coach-soft);color:var(--coach)}
.coachbtn{background:var(--coach);border-color:var(--coach);color:#fff}
.iconbtn.coachav{border-color:var(--coach);color:var(--coach)}
.chev{color:var(--muted);display:grid;place-items:center}
.team:hover .chev,.srow:hover .chev{color:var(--accent)}
.logo.sm,.glyph.sm{width:40px;height:40px;border-radius:10px}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px}
.lock svg{flex:0 0 auto;margin-top:2px}
.tablewrap{overflow-x:auto;box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:9px 10px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left;white-space:nowrap;font-weight:600;position:sticky;left:0;background:var(--surface)}
.tbl tr.me td{background:var(--accent-soft);color:var(--fg)}
.tbl tr.me td:first-child{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.tbl.entry td{padding:5px 4px}
.tbl.entry td:first-child{padding-left:10px;font-size:13px}
.tbl.entry input{width:52px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:right;min-height:36px}
.tbl.entry input:focus{outline:none;border-color:var(--accent)}
.addcard{margin-top:10px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);gap:12px}
.addgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.addrow{flex-direction:row;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px}
.score{display:flex;align-items:center;justify-content:center;gap:24px;text-align:center;padding:6px 0}
.score b{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
</style>
</head>

function seasonTotals(t){
  const f=SPORTS[t.sport].fields.map(x=>x[0]);const names=[...new Set([...t.roster,...S.games.filter(g=>g.teamId===t.id).flatMap(g=>Object.keys(g.box||{}))])];
  return names.map(n=>{const o={name:n,gp:0,minutes:0};f.forEach(k=>o[k]=0);S.games.filter(g=>g.teamId===t.id).forEach(g=>{const b=g.box?.[n];if(played(b)){o.gp++;o.minutes+=+b.minutes||0;f.forEach(k=>o[k]+=+b[k]||0)}});return o}).sort((a,b)=>b[f[0]]-a[f[0]]);
}

function achievements(){
  const L=sorted(entries()).reverse();const matches=L.filter(l=>l.type==='match');
  const tot=(sp,k)=>matches.filter(l=>!sp||l.sport===sp).reduce((s,l)=>s+(+l.stats?.[k]||0),0);
  let streak=0;Object.keys(SPORTS).forEach(sp=>{let c=0;matches.filter(m=>m.sport===sp).forEach(m=>{c=m.result==='W'?c+1:0;streak=Math.max(streak,c)})});
  const mins=L.reduce((s,l)=>s+(+l.minutes||0),0),wins=matches.filter(m=>m.result==='W').length;
  return [
    ['First whistle','Log your first session.','flag',L.length,1,'sessions'],
    ['Showing up','Log 10 sessions, practice or match.','pulse',L.length,10,'sessions'],
    ['Grinder','Log 5 practice sessions.','cone',L.length-matches.length,5,'practices'],
    ['Taste of victory','Record your first win.','trophy',wins,1,'wins'],
    ['Winning ways','Record 10 wins in any sport.','trophy',wins,10,'wins'],
    ['On a roll','Win 3 matches in a row in the same sport.','flame',streak,3,'straight wins'],
    ['Putting in the time','Log 300 minutes of play and practice.','clock',mins,300,'minutes'],
    ['Built to last','Reach 1,000 logged minutes.','shield',mins,1000,'minutes'],
    ['Team player','Record 25 assists across sports.','teams',tot(null,'assists'),25,'assists'],
    ['Century scorer','Score 100 basketball points in matches.','target',tot('basketball','points'),100,'points','Basketball'],
    ['Clinical finisher','Score 10 soccer goals in matches.','target',tot('football','goals'),10,'goals','Soccer'],
    ['Above the net','Record 50 volleyball kills in matches.','target',tot('volleyball','kills'),50,'kills','Volleyball'],
    ['Squad up','Join 2 teams.','teams',joinedTeams().length,2,'teams'],
    ['All-rounder','Log sessions in 2 different sports.','star',new Set(L.map(l=>l.sport)).size,2,'sports']
  ].map(([name,desc,icon,have,need,unit,sport])=>({name,desc,icon,have:Math.min(have,need),need,unit,sport,done:have>=need,pct:Math.min(100,Math.round(have/need*100))}));
}

/* ---------- shared pieces ---------- */
const tile=(icon,lab,val,suf='')=>`<div class="card kpi"><div class="lab">${ic(icon,16)}${lab}</div><div class="val">${val}${suf?`<small>${suf}</small>`:''}</div></div>`;
function lineSvg(pts,label){
  const W=320,H=150,L=30,R=10,T=10,B=24;
  const raw=Math.max(...pts.map(p=>p.v),1);const step=raw<=5?1:raw<=12?3:raw<=30?6:raw<=60?15:raw<=120?30:Math.ceil(raw/4/10)*10;
  const max=Math.ceil(raw/step)*step;const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z`;
  const showLab=i=>pts.length<=6||i===0||i===pts.length-1||i===Math.floor((pts.length-1)/2);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>{const last=i===pts.length-1;return `<circle cx="${x(i)}" cy="${y(p.v)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="${p.mark==='P'?'var(--warn)':p.mark==='L'?'var(--bad)':'var(--accent)'}" stroke-width="2"/>`}).join('')}
    ${pts.map((p,i)=>showLab(i)?`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${fmtDate(p.d)}</text>`:'').join('')}</svg>`;
}
function chartCard({title,sub,pts,avgLabel,select,empty}){
  const head=`<div class="charthead"><div><h2>${title}</h2><div class="small muted">${sub}</div></div>${select||''}</div>`;
  if(pts.length<2)return `<div class="card pad chart">${head}<div class="empty"><b>Not enough data yet</b>${empty}</div></div>`;
  const avg=pts.reduce((s,p)=>s+p.v,0)/pts.length;
  return `<div class="card pad chart">${head}<div style="margin-top:8px"><span class="big">${avg.toFixed(1)}</span> <span class="small muted">${avgLabel}</span></div>${lineSvg(pts,title)}</div>`;
}
function playerChart(sp){
  const fields=[...SPORTS[sp].fields,['minutes','Minutes']];
  if(!UI.metric||!fields.some(f=>f[0]===UI.metric))UI.metric=SPORTS[sp].unit;
  const k=UI.metric,lab=fields.find(f=>f[0]===k)[1];
  const E=entries();const src=k==='minutes'?E.filter(l=>l.sport===sp&&(UI.type==='all'||l.type===UI.type)):E.filter(l=>l.sport===sp&&l.type==='match');
  const pts=sorted(src).reverse().slice(-10).map(l=>({d:l.date,v:k==='minutes'?+l.minutes||0:+l.stats?.[k]||0,mark:l.type==='practice'?'P':''}));
  return chartCard({title:'Performance trend',sub:`${k==='minutes'?'Minutes per session':lab+' per match'} · last ${pts.length}`,pts,avgLabel:`Avg. ${k==='minutes'?'minutes':lab.toLowerCase()}`,
    select:`<select class="mini" id="metricSel" aria-label="Metric">${fields.map(([fk,fl])=>`<option value="${fk}" ${fk===k?'selected':''}>${fl}</option>`).join('')}</select>`,empty:`Log at least two ${k==='minutes'?'sessions':'matches'} to see a trend.`});
}
function sportChips(){return `<div class="chips" role="group" aria-label="Sport">${sportsUsed().map(k=>`<button class="chip" data-act="sport" data-v="${k}" aria-pressed="${k===curSport()}">${SPORTS[k].name}</button>`).join('')}</div>`}

      <span class="r"><b>${+l.stats?.[u]||0}<small>${u}</small></b><span class="pill ${l.result}">${RES[l.result]}</span></span></button>`;

/* ---------- modals ---------- */
let modalCtx=null;
// Sheets remember the window they were opened from, so X steps back one window at a time.
let modalStack=[],navBack=false,navTop=0;
const sameCtx=(a,b)=>!!a&&!!b&&a.kind===b.kind&&a.id===b.id&&(a.kind!=='player'||a.i===b.i);
const REOPEN={team:c=>teamDetail(c.id,c.lb),school:c=>schoolSheet(c.id,c.f),player:c=>playerSheet(c.id,c.i),game:c=>gameDetail(c.id),detail:c=>logDetail(c.id),claim:c=>claimSheet(c.id)};
function openModal(html,ctx){
  const m=document.getElementById('modal');const old=m.querySelector('.sheet');const pc=modalCtx;
  const same=!!old&&sameCtx(pc,ctx);let top=same?old.scrollTop:0,restored=false;
  if(!old)modalStack=[];
  else if(!same){
    if(navBack){top=navTop;restored=true}
    else{
      const i=ctx?modalStack.findIndex(e=>sameCtx(e.ctx,ctx)):-1;
      if(i>=0){top=modalStack[i].top;modalStack=modalStack.slice(0,i);restored=true}
      else if(pc&&REOPEN[pc.kind])modalStack.push({ctx:pc,top:old.scrollTop});
    }
  }
  modalCtx=ctx||null;m.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sh=m.querySelector('.sheet');
  document.documentElement.classList.add('modal-open');
  if(same||restored){sh.style.animation='none';sh.scrollTop=top}
}
function closeModal(){document.getElementById('modal').innerHTML='';modalCtx=null;modalStack=[];document.documentElement.classList.remove('modal-open')}
function back(){
  while(modalStack.length){
    const e=modalStack.pop(),before=modalCtx;navBack=true;navTop=e.top;
    try{REOPEN[e.ctx.kind](e.ctx)}finally{navBack=false}
    if(modalCtx!==before)return;
  }
  closeModal();
}
const sheetHead=t=>`<div class="sheethead"><h2>${t}</h2><button class="iconbtn" data-act="close" aria-label="Close" style="flex:0 0 auto">${ic('x',18)}</button></div>`;

    ${cities.map(c=>`<optgroup label="${c}">${list.filter(x=>x.city===c).map(x=>`<option ${x.name===val?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('')}

const CERR={'permission-denied':'You don’t have permission to do that.','unavailable':'You’re offline. This will sync when you reconnect.','not-found':'That item no longer exists.'};
const cfail=e=>{console.warn(e);toast(CERR[e?.code]||'Couldn’t save. Check your connection and try again.')};
const isMeName=(t,n)=>cloud()?t?.ruid?.[n]===USER.uid:(!isCoach()&&n===S.profile.name);

function cloudBlank(){const st=blank({role:'player'});st.cloud=true;st.teams.forEach(t=>{t.code='';t.roster=[];t.rosterLoaded=false});st.people={};st.coachApproved=false;st.myTeamIds=[];return st}
function applyUser(d){
  S.role=d.role==='coach'?'coach':'player';
  const P={name:d.name||'',school:d.school||'',schoolId:d.schoolId||'',sport:d.sport||''};
  if(S.role==='coach'){S.coach={...S.coach,...P,title:d.title||'Coach'};S.coachApproved=!!d.coachApproved}
  else S.profile={...S.profile,...P,grade:d.grade||'',position:d.position||'',jersey:d.jersey||''};
  S.myTeamIds=d.teams||[];
  if(S.role==='player')S.myTeamIds.forEach(watchTeam);

function watchTeam(id){
  const t=S.teams.find(x=>x.id===id);if(!t)return;
  sub('t:'+id,db.doc('teams/'+id),s=>{
    const d=s.data()||{};t.exists=s.exists;t.coach=d.coachName||'';t.coachUid=d.coachUid||null;t.meets=d.meets||'';
    t.managed=!!t.coachUid&&t.coachUid===USER.uid;
    if(t.managed&&isCoach()){sub('i:'+id,db.doc(`teams/${id}/private/invite`),x=>{t.code=x.data()?.code||'';refresh()});
      sub('ca:'+id,db.collection(`teams/${id}/corrections`),x=>setCorr(id,x))}
    refresh();
  });
  if(!isCoach())sub('cm:'+id,db.collection(`teams/${id}/corrections`).where('uid','==',USER.uid),x=>setCorr(id,x));
  sub('r:'+id,db.collection(`teams/${id}/roster`),s=>{
    const rows=s.docs.map(d=>({rid:d.id,...d.data()})).sort((a,b)=>(+a.jersey||0)-(+b.jersey||0)||String(a.name).localeCompare(b.name));
    t.roster=rows.map(r=>r.name);t.rids={};t.ruid={};t.rosterLoaded=true;t.ridName=Object.fromEntries(rows.map(r=>[r.rid,r.name]));
    rows.forEach(r=>{t.rids[r.name]=r.rid;t.ruid[r.name]=r.uid||null;S.people[r.name]=[r.position||'',r.jersey!=null&&r.jersey!==''?String(r.jersey):'']});
    t.joined=rows.some(r=>r.uid===USER.uid);
    nameBoxes(t);refresh();
  });
  sub('g:'+id,db.collection(`teams/${id}/games`),s=>{
    S.games=S.games.filter(g=>g.teamId!==id).concat(s.docs.map(d=>{const x=d.data();
      return {id:d.id,teamId:id,date:x.date,opponent:x.opponent,us:x.us,them:x.them,result:x.result,location:x.location,raw:x.box||{},box:{},boxRid:{}}}));
    nameBoxes(t);refresh();
  });
}
function setCorr(teamId,snap){S.corrections=(S.corrections||[]).filter(c=>c.teamId!==teamId).concat(snap.docs.map(d=>({...d.data(),id:d.id,teamId})));refresh()}
// Box scores are stored by roster spot id. Show each one under the spot's current name, so renaming
// a player (or a player renaming themselves) keeps their past games linked.
function nameBoxes(t){S.games.filter(g=>g.teamId===t.id&&g.raw).forEach(g=>{const box={},boxRid={};
  Object.entries(g.raw).forEach(([rid,b])=>{const {name,...st}=b;const n=t.ridName?.[rid]||name||rid;box[n]=st;boxRid[n]=rid});g.box=box;g.boxRid=boxRid})}
function watchSchool(schoolId){

    s.docs.forEach(d=>{const t=S.teams.find(x=>x.id===d.id);if(!t)return;const x=d.data();t.exists=true;t.coach=x.coachName||'';t.coachUid=x.coachUid||null;t.meets=x.meets||'';t.managed=!!t.coachUid&&t.coachUid===USER.uid});

function startSync(){

    let first=true;

    sub('logs',db.collection(`users/${USER.uid}/logs`),s=>{S.logs=s.docs.map(d=>({...d.data(),id:d.id}));refresh()});
    sub('mine',db.collection('teams').where('coachUid','==',USER.uid),s=>{s.docs.forEach(d=>watchTeam(d.id));refresh()});

async function deleteAccount(fd){
  const err=m=>{const x=document.getElementById('del-err');if(x){x.textContent=m;x.hidden=false}};
  const btn=document.getElementById('del-go');const busy=on=>{if(btn){btn.disabled=on;btn.textContent=on?'Deleting…':'Delete my account'}};
  if(!cloud()){
    const accts=lsGet('stateam.accounts')||{};const email=Object.keys(accts).find(k=>accts[k].uid===USER.uid);
    if(email){delete accts[email];lsSet('stateam.accounts',accts)}
    lsDel(dataKey(USER.uid));signOut();toast('Your account was deleted');return;
  }
  const u=fbAuth.currentUser;if(!u)return err('You’re signed out. Log in again, then try once more.');
  busy(true);
  try{
    if(provider()==='password'){const pw=fd.get('password')||'';if(!pw){busy(false);return err('Enter your password.')}
      await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw))}
    else await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider());
  }catch(e){busy(false);return err(AUTH_ERR[e?.code]||'Couldn’t confirm it’s you. Try again.')}
  const uid=USER.uid;
  try{
    unsubAll();
    if(isCoach()){
      for(const t of managedTeams()){

        await db.doc(`teams/${t.id}/private/invite`).delete().catch(()=>{});
        await db.doc('teams/'+t.id).update({coachUid:null,coachName:''}).catch(()=>{});
      }
    }else{
      const ids=new Set([...(S.myTeamIds||[]),...joinedTeams().map(t=>t.id)]);
      for(const id of ids){
        const r=await db.collection(`teams/${id}/roster`).where('uid','==',uid).get().catch(()=>null);
        for(const d of (r?.docs||[]))await (d.id===uid?d.ref.delete():d.ref.update({uid:null})).catch(()=>{});
        await db.doc(`teams/${id}/joins/${uid}`).delete().catch(()=>{});
      }
      const logs=await db.collection(`users/${uid}/logs`).get();
      for(const d of logs.docs)await d.ref.delete();
    }
    await db.doc(`users/${uid}/private/contact`).delete().catch(()=>{});
    await db.doc('users/'+uid).delete();
    await u.delete();
  }catch(e){console.warn(e);busy(false);return err('Something went wrong while deleting. Check your connection and try again.')}
  lsDel('stateam.session');USER=null;S=null;closeModal();AUTH.mode='login';AUTH.err='';AUTH.info='Your account and data were deleted.';showAuth();
}

const useFirebase=!!FIREBASE_CONFIG.apiKey;
let USER=null,fbAuth=null;
const AUTH={mode:'login',role:'player',busy:false,err:'',info:'',pending:null};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const dataKey=uid=>KEY+':'+uid;
const LOGO='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3v17h18"/><path d="M8 16v-4M12 16V7M16 16v-6M20 16v-9"/></svg>';
const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
const AUTH_ERR={
  'auth/email-already-in-use':'An account with this email already exists. Log in instead.',
  'auth/invalid-email':'Enter a valid email address.',
  'auth/weak-password':'Use at least 8 characters for your password.',
  'auth/invalid-credential':'Email or password is incorrect.',
  'auth/invalid-login-credentials':'Email or password is incorrect.',
  'auth/wrong-password':'Email or password is incorrect.',
  'auth/user-not-found':'No account uses this email. Sign up instead.',
  'auth/user-disabled':'This account has been turned off. Contact your school.',
  'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
  'auth/popup-closed-by-user':'The Google window closed before sign-in finished.',
  'auth/cancelled-popup-request':'The Google window closed before sign-in finished.',
  'auth/popup-blocked':'Your browser blocked the Google window. Allow pop-ups for this site and try again.',
  'auth/unauthorized-domain':'This website isn’t on the authorized domains list in Firebase yet.',
  'auth/operation-not-allowed':'This sign-in method isn’t turned on in Firebase yet.',
  'auth/network-request-failed':'Network error. Check your connection and try again.',
  'auth/account-exists-with-different-credential':'This email already uses a password login. Log in with email instead.'
};

function newAccount(a){
  const st=blank({role:a.role});st.account={role:a.role,name:a.name,school:a.school,email:a.email||''};
  if(a.role==='coach')Object.assign(st.coach,{name:a.name,school:a.school,title:'Coach'});
  else Object.assign(st.profile,{name:a.name,school:a.school});
  return st;
}
function enter(user){
  USER=user;closeModal();
  const saved=lsGet(dataKey(user.uid));
  if(saved&&saved.logs&&saved.coach){S=ensureSchoolTeams(saved);return showApp()}
  S=null;
  const p=AUTH.pending;AUTH.pending=null;
  if(p&&p.school){S=newAccount({...p,name:p.name||user.name||'',email:user.email});
    if(!S.account.name)return showOnboarding();
    save();showApp();toast('Welcome to Stateam');return}
  showOnboarding();
}
function enterDemo(role){
  USER={uid:'demo-'+role,demo:true,email:''};
  lsSet('stateam.session',{uid:USER.uid,demo:true,role});
  const saved=lsGet(dataKey(USER.uid));
  if(saved&&saved.logs&&saved.coach)S=ensureSchoolTeams(saved);else{S=sample();S.role=role;save()}
  showApp();
}
function signOut(){
  const wasDemo=USER?.demo;
  lsDel('stateam.session');unsubAll();USER=null;S=null;closeModal();
  AUTH.mode='login';AUTH.err='';AUTH.info='';
  if(fbAuth&&!wasDemo)fbAuth.signOut().catch(()=>{});
  showAuth();
}
function showApp(){
  document.getElementById('auth').hidden=true;
  document.querySelector('.app').hidden=false;document.querySelector('nav.tabs').hidden=false;
  UI.tab='home';render();window.scrollTo(0,0);
}
function showAuth(){
  document.querySelector('.app').hidden=true;document.querySelector('nav.tabs').hidden=true;
  const el=document.getElementById('auth');el.hidden=false;renderAuth();
}

const schoolOptions=val=>{const cities=[...new Set(SCHOOLS.map(x=>x.city))];
  return `<option value="">Choose your school</option>${cities.map(c=>`<optgroup label="${c}">${SCHOOLS.filter(x=>x.city===c).map(x=>`<option ${x.name===val?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`).join('')}`};
const roleCards=()=>`<div class="f"><label>I’m a</label><div class="roles" role="group" aria-label="Account type">${[
  ['player','profile','Player','Log my own stats and join my school’s teams'],
  ['coach','whistle','Coach or manager','Run teams and post official game stats']
].map(([k,i,t,d])=>`<button type="button" class="rolecard" data-act="authRole" data-v="${k}" aria-pressed="${AUTH.role===k}"><span class="ri">${ic(i,20)}</span><b>${t}</b><span class="small muted">${d}</span></button>`).join('')}</div></div>`;
const msgs=()=>`<div id="auth-err" class="err" ${AUTH.err?'':'hidden'}>${esc(AUTH.err)}</div><div id="auth-info" class="okmsg" ${AUTH.info?'':'hidden'}>${esc(AUTH.info)}</div>`;

const POLICY_VERSION='2026-10-21';
const agreeBox=id=>`<label class="agree" for="${id}"><input type="checkbox" id="${id}" name="agree" value="1"><span>I agree to the <a href="privacy" target="_blank" rel="noopener">Privacy Policy</a> and <a href="terms" target="_blank" rel="noopener">Terms of Service</a>.</span></label>`;
function renderAuth(loading){
  const el=document.getElementById('auth');
  if(loading){el.innerHTML=`<div class="auth"><div class="authbrand">${LOGO}Stateam</div><p class="muted">Loading…</p></div>`;return}
  const su=AUTH.mode==='signup';
  const keep=id=>esc(document.getElementById(id)?.value||'');
  const email=keep('au-email'),name=keep('au-name'),school=document.getElementById('au-school')?.value||'';
  el.innerHTML=`<div class="auth">
    <div class="authbrand">${LOGO}Stateam</div>
    <div><h1>${su?'Create your account.':'Welcome back.'}</h1><p class="sub" style="margin:4px 0 0">${su?'Players log their own stats. Coaches run their teams.':'Log in to see your stats and teams.'}</p></div>
    <div class="seg" role="group" aria-label="Log in or sign up">${[['login','Log in'],['signup','Sign up']].map(([k,l])=>`<button type="button" data-act="authMode" data-v="${k}" aria-pressed="${AUTH.mode===k}">${l}</button>`).join('')}</div>
    <form id="authForm" novalidate>
      ${su?roleCards()+`<div class="f"><label for="au-name">Full name</label><input id="au-name" name="name" autocomplete="name" value="${name}" placeholder="e.g. Alex Lee"></div>
      <div class="f"><label for="au-school">School</label><select id="au-school" name="school">${schoolOptions(school)}</select></div>`:''}
      <div class="f"><label for="au-email">Email</label><input id="au-email" name="email" type="email" autocomplete="email" inputmode="email" value="${email}" placeholder="you@school.org"></div>
      <div class="f"><div class="sechead"><label for="au-pw">Password</label>${su?'':`<button type="button" class="link small" data-act="forgot">Forgot password?</button>`}</div>
        <div class="pwrap"><input id="au-pw" name="password" type="password" autocomplete="${su?'new-password':'current-password'}" placeholder="${su?'At least 8 characters':''}"><button type="button" class="link small" data-act="pwToggle" aria-label="Show password">Show</button></div></div>
      ${su?`<div class="f"><label for="au-pw2">Confirm password</label><div class="pwrap"><input id="au-pw2" name="password2" type="password" autocomplete="new-password" placeholder="Type it again"><button type="button" class="link small" data-act="pwToggle" data-for="au-pw2" aria-label="Show password">Show</button></div></div>${agreeBox('au-agree')}`:''}
      ${msgs()}
      <button class="btn primary block" id="au-submit" type="submit">${su?'Create account':'Log in'}</button>
    </form>
    <div class="or"><span>or</span></div>
    <button type="button" class="btn block gbtn" data-act="google">${GLOGO}${su?'Sign up with Google':'Continue with Google'}</button>
    ${useFirebase?'':`<div class="notice">Preview mode. Accounts are saved in this browser only, and Google sign-in turns on once the Firebase config is added.</div>`}
    <div class="demo"><span>Just looking? Try a demo:</span><button type="button" class="btn sm" data-act="demo" data-v="player">Player</button><button type="button" class="btn sm" data-act="demo" data-v="coach">Coach</button></div>
  </div>`;
}
function showOnboarding(){
  document.querySelector('.app').hidden=true;document.querySelector('nav.tabs').hidden=true;
  const el=document.getElementById('auth');el.hidden=false;AUTH.err='';AUTH.info='';
  el.innerHTML=`<div class="auth">
    <div class="authbrand">${LOGO}Stateam</div>
    <div><h1>Finish setting up.</h1><p class="sub" style="margin:4px 0 0">${USER.email?`Signed in as ${esc(USER.email)}. `:''}Tell us who you are so we can show the right tools.</p></div>
    <form id="onbForm" novalidate>${roleCards()}
      <div class="f"><label for="ob-name">Full name</label><input id="ob-name" name="name" autocomplete="name" value="${esc(USER.name||'')}"></div>
      <div class="f"><label for="ob-school">School</label><select id="ob-school" name="school">${schoolOptions('')}</select></div>
      ${agreeBox('ob-agree')}
      ${msgs()}
      <button class="btn primary block" type="submit">Continue</button></form>
    <button type="button" class="link small" style="align-self:center" data-act="signOut">Use a different account</button>
  </div>`;
}
function authMsg(err,info){AUTH.err=err||'';AUTH.info=info||'';const e=document.getElementById('auth-err'),i=document.getElementById('auth-info');
  if(e){e.textContent=AUTH.err;e.hidden=!AUTH.err}if(i){i.textContent=AUTH.info;i.hidden=!AUTH.info}}
function setBusy(on){AUTH.busy=on;const b=document.getElementById('au-submit');if(b){b.disabled=on;b.textContent=on?'Please wait…':(AUTH.mode==='signup'?'Create account':'Log in')}}
async function sha(s){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function localAuth(mode,email,pw){
  const accts=lsGet('stateam.accounts')||{};const h=await sha(email+'\n'+pw);
  if(mode==='signup'){if(accts[email])throw {code:'auth/email-already-in-use'};
    const uid='local-'+Date.now().toString(36)+newCode().toLowerCase();accts[email]={uid,hash:h};lsSet('stateam.accounts',accts);return {uid,email}}
  const a=accts[email];if(!a)throw {code:'auth/user-not-found'};if(a.hash!==h)throw {code:'auth/invalid-credential'};return {uid:a.uid,email};
}
async function doAuth(fd){
  if(AUTH.busy)return;
  const su=AUTH.mode==='signup',email=(fd.get('email')||'').trim().toLowerCase(),pw=fd.get('password')||'';
  if(su){const name=(fd.get('name')||'').trim(),school=fd.get('school')||'';
    if(!name)return authMsg('Enter your full name.');
    if(!school)return authMsg('Choose your school.');
    if(!/^\S+@\S+\.\S+$/.test(email))return authMsg('Enter a valid email address.');
    if(pw.length<8)return authMsg('Use at least 8 characters for your password.');
    if(pw!==(fd.get('password2')||''))return authMsg('The two passwords don’t match.');
    if(!fd.get('agree'))return authMsg('To create an account, agree to the Privacy Policy and Terms of Service.');
    AUTH.pending={role:AUTH.role,name,school,agreed:true};
  }else{
    if(!/^\S+@\S+\.\S+$/.test(email))return authMsg('Enter a valid email address.');
    if(!pw)return authMsg('Enter your password.');
  }
  authMsg();setBusy(true);
  try{
    if(useFirebase){
      if(su){const c=await fbAuth.createUserWithEmailAndPassword(email,pw);c.user.updateProfile({displayName:AUTH.pending?.name||S?.account?.name||''}).catch(()=>{})}
      else await fbAuth.signInWithEmailAndPassword(email,pw);
    }else{const u=await localAuth(AUTH.mode,email,pw);lsSet('stateam.session',{uid:u.uid,email});enter(u)}
  }catch(e){AUTH.pending=null;authMsg(AUTH_ERR[e?.code]||'Something went wrong. Try again.')}
  finally{setBusy(false)}
}
async function googleAuth(){
  if(!useFirebase)return authMsg('Google sign-in turns on once the Firebase config is added. Use email for now, or try a demo.');
  if(AUTH.mode==='signup'){const f=document.getElementById('authForm');const fd=new FormData(f);
    if(!fd.get('agree'))return authMsg('To sign up with Google, first agree to the Privacy Policy and Terms of Service.');
    if(fd.get('school'))AUTH.pending={role:AUTH.role,name:(fd.get('name')||'').trim(),school:fd.get('school'),agreed:true}}
  authMsg();
  try{await fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){AUTH.pending=null;authMsg(AUTH_ERR[e?.code]||'Google sign-in didn’t finish. Try again.')}
}
async function forgotPw(){
  const email=(document.getElementById('au-email')?.value||'').trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(email))return authMsg('Enter your email above first, then tap “Forgot password?”.');
  if(!useFirebase)return authMsg('Password reset emails turn on once the Firebase config is added.');
  try{await fbAuth.sendPasswordResetEmail(email);authMsg('',`If an account uses ${email}, a reset link is on its way. Check your inbox.`)}
  catch(e){authMsg(AUTH_ERR[e?.code]||'Couldn’t send the reset email. Try again.')}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function initFirebase(){
  const base=`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/`;
  await loadScript(base+'firebase-app-compat.js');await loadScript(base+'firebase-auth-compat.js');await loadScript(base+'firebase-firestore-compat.js');
  firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth();db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  fbAuth.onAuthStateChanged(u=>{
    if(USER?.demo)return;
    if(u){if(USER?.uid!==u.uid)enterCloud({uid:u.uid,email:u.email||'',name:u.displayName||''})}
    else if(USER){unsubAll();USER=null;S=null;showAuth()}
    else showAuth();
  });
}
async function boot(){
  applyTheme();
  const sess=lsGet('stateam.session');
  if(sess?.demo)return enterDemo(sess.role==='coach'?'coach':'player');
  if(useFirebase){document.querySelector('.app').hidden=true;document.querySelector('nav.tabs').hidden=true;document.getElementById('auth').hidden=false;renderAuth(true);
    try{await initFirebase()}catch(e){AUTH.err='Couldn’t reach the sign-in service. Check your connection and reload the page.';showAuth()}return}
  if(sess?.uid)return enter({uid:sess.uid,email:sess.email||''});
  showAuth();
}

boot();
</script>
