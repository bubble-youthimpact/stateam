<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06080d">
<title>Stateam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app column, sticky header, fixed bottom tab bar; cards only for grouped data */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#eceff5; --line:#dce1ea;
  --fg:#0c1220; --muted:#5a6477; --accent:#2557d6; --accent-fg:#ffffff;
  --accent-soft:rgba(37,87,214,.10); --good:#17855a; --good-soft:rgba(23,133,90,.12);
  --bad:#c23a45; --bad-soft:rgba(194,58,69,.10); --warn:#a76a00; --warn-soft:rgba(167,106,0,.12);
  --shadow:0 1px 2px rgba(12,18,32,.06),0 8px 24px rgba(12,18,32,.06);
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06080d; --surface:#10141c; --surface2:#171c27; --line:#242b38;
  --fg:#edf1f8; --muted:#8a94a7; --accent:#3a74f2; --accent-fg:#ffffff;
  --accent-soft:rgba(58,116,242,.16); --good:#4cc38a; --good-soft:rgba(76,195,138,.14);
  --bad:#f06b74; --bad-soft:rgba(240,107,116,.14); --warn:#e5ac3d; --warn-soft:rgba(229,172,61,.14);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06080d; --surface:#10141c; --surface2:#171c27; --line:#242b38;
  --fg:#edf1f8; --muted:#8a94a7; --accent:#3a74f2; --accent-fg:#ffffff;
  --accent-soft:rgba(58,116,242,.16); --good:#4cc38a; --good-soft:rgba(76,195,138,.14);
  --bad:#f06b74; --bad-soft:rgba(240,107,116,.14); --warn:#e5ac3d; --warn-soft:rgba(229,172,61,.14);
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 112px;min-height:100vh}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand svg{color:var(--accent)}
.brand b{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
h1{font-size:26px;line-height:1.15;letter-spacing:-.03em;margin:14px 0 4px;text-wrap:balance;font-weight:800}
.sub{color:var(--muted);margin:0 0 14px}
h2{font-size:17px;letter-spacing:-.01em;margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:11px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);outline:1px solid var(--line)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px}
.kpi .lab{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600}
.kpi .lab svg{color:var(--accent)}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}

.chart svg{display:block;width:100%;height:auto}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.charthead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
select.mini{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;font-weight:600}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:13px}
.row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .r b{font-size:17px;font-variant-numeric:tabular-nums}
.row .r b small{font-size:11px;color:var(--muted);font-weight:600;margin-left:3px}
.glyph{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.glyph.prac{background:var(--warn-soft);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.pill.W{background:var(--good-soft);color:var(--good)}
.pill.L{background:var(--bad-soft);color:var(--bad)}
.pill.D{background:var(--surface2);color:var(--muted)}
.pill.P{background:var(--warn-soft);color:var(--warn)}
.pill.n{background:var(--surface2);color:var(--muted)}
.pill.a{background:var(--accent-soft);color:var(--accent)}

.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pr{padding:12px}
.pr .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pr .d{font-size:12px;color:var(--muted)}

.team{padding:16px;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;cursor:pointer;text-align:left;width:100%}
.team:hover{border-color:var(--accent)}
.team .glyph{width:48px;height:48px;border-radius:13px}
.avatars{display:flex}
.avatars span{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:2px solid var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center;margin-left:-6px}
.avatars span:first-child{margin-left:0}

.ach{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:16px;align-items:start}
.ach .glyph{width:48px;height:48px;border-radius:13px;background:var(--surface2);color:var(--muted)}
.ach.done .glyph{background:var(--accent-soft);color:var(--accent)}
.ach.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.callout{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.callout svg{color:var(--accent)}

.profile-hero{overflow:hidden}
.profile-hero .cover{height:84px;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#0b1a3d))}
.profile-hero .av{width:76px;height:76px;border-radius:50%;background:var(--surface2);border:4px solid var(--surface);display:grid;place-items:center;font-size:24px;font-weight:800;margin-top:-38px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.trio div b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(4,7,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:560px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheethead h2{font-size:20px}
form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:46px;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.rating{display:flex;gap:6px}
.rating button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 0;font-weight:700;cursor:pointer}
.rating button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;font-size:20px;letter-spacing:.12em;user-select:all}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3v17h18"/><path d="M8 16v-4M12 16V7M16 16v-6M20 16v-9"/></svg>Stateam</div>
    <button class="iconbtn" id="avatarBtn" data-act="tab" data-tab="profile" aria-label="Open profile"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
const I={
  home:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
  teams:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/>',
  stats:'<path d="M3 3v17h18"/><path d="M8 16v-4M12 16V7M16 16v-6M20 16v-9"/>',
  awards:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v3M8 21h8M9 17h6v4H9z"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/>',
  pulse:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  trophy:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8"/>',
  clock:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',
  cone:'<path d="M10 3h4l5 16H5z"/><path d="M3 21h18M8.2 10h7.6M6.9 14.5h10.2"/>',
  medal:'<circle cx="12" cy="15" r="6"/><path d="M8.5 10L6 3h4l2 5 2-5h4l-2.5 7"/>',
  flame:'<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.3-4 2.5-5 .2 1.7 1 2.6 2 3 0-3-.5-5.5.5-8z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2 2"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SPORTS={
  basketball:{name:'Basketball',unit:'points',fields:[['points','Points'],['rebounds','Rebounds'],['assists','Assists']]},
  football:{name:'Football',unit:'goals',fields:[['goals','Goals'],['assists','Assists'],['shots','Shots']]},
  volleyball:{name:'Volleyball',unit:'kills',fields:[['kills','Kills'],['aces','Aces'],['blocks','Blocks']]}
};
const KEY='stateam.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmtDate=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});

function sample(){
  const m=(date,sport,opp,us,them,min,stats,team)=>({id:uid(),type:'match',sport,date,opponent:opp,us,them,result:us>them?'W':us<them?'L':'D',minutes:min,stats,teamId:team,notes:''});
  const p=(date,sport,focus,min,rating,stats,team,notes='')=>({id:uid(),type:'practice',sport,date,focus,minutes:min,rating,stats,teamId:team,notes});
  return {
    sample:true,
    profile:{name:'Alex Lee',school:'Hanseo High School',grade:'Grade 11',sport:'basketball',position:'Shooting guard',jersey:'27'},
    theme:'system',
    teams:[
      {id:'t1',name:'Hanseo Jets',sport:'basketball',level:'Varsity',coach:'Coach Park',meets:'Mon · Wed · Fri, 4:00 pm · Main gym',code:'JETS27',roster:['Alex Lee','Jiho Park','Chaeyoung Lim','Seojun Kim','Minjae Cho','Dohyun Yoon','Ian Moon','Taeyang Seo'],joined:true},
      {id:'t2',name:'Weekend United',sport:'football',level:'Club',coach:'Student-run',meets:'Sat, 10:00 am · Back field',code:'WKND09',roster:['Alex Lee','Ryan Lee','Hyunwoo Jang','Sungmin Oh','Daniel Kang'],joined:true},
      {id:'t3',name:'Hanseo Spikers',sport:'volleyball',level:'Varsity',coach:'Coach Han',meets:'Tue · Thu, 4:30 pm · Gym B',code:'SPIKE4',roster:['Yuna Choi','Haeun Song','Jisoo Bae','Minji Kwon','Soyeon Ahn','Nari Jung'],joined:false},
      {id:'t4',name:'Hanseo FC',sport:'football',level:'Varsity',coach:'Coach Shin',meets:'Mon · Thu, 4:00 pm · Main field',code:'HFC110',roster:['Woojin Lee','Joon Park','Kevin Hwang','Eunho Baek','Siwoo Nam','Gunwoo Ko','Hajun Yang'],joined:false}
    ],
    logs:[
      m('2026-09-08','basketball','Busan Falcons',55,62,26,{points:12,rebounds:4,assists:3},'t1'),
      p('2026-09-10','basketball','Catch-and-shoot threes',90,3,{points:0,rebounds:0,assists:0},'t1','Feet set late on the left wing.'),
      m('2026-09-14','basketball','Daejeon Bears',64,60,30,{points:19,rebounds:5,assists:4},'t1'),
      p('2026-09-17','basketball','Ball handling under pressure',75,4,{points:0,rebounds:0,assists:0},'t1'),
      m('2026-09-19','basketball','Seoul Knights',75,69,28,{points:16,rebounds:6,assists:5},'t1'),
      m('2026-09-20','football','Gwangju FC',2,2,70,{goals:1,assists:0,shots:4},'t2'),
      p('2026-09-22','basketball','Free throws, 100 reps',60,4,{points:0,rebounds:0,assists:0},'t1','Made 81 of 100.'),
      m('2026-09-24','basketball','Incheon Wolves',58,63,32,{points:21,rebounds:3,assists:6},'t1'),
      p('2026-09-26','football','Finishing drills',80,3,{goals:0,assists:0,shots:0},'t2'),
      m('2026-09-28','basketball','Busan Falcons',68,61,27,{points:18,rebounds:7,assists:4},'t1'),
      p('2026-10-01','basketball','Defensive slides + closeouts',90,5,{points:0,rebounds:0,assists:0},'t1'),
      m('2026-10-03','basketball','Seoul Knights',72,64,29,{points:24,rebounds:5,assists:5},'t1'),
      p('2026-10-08','basketball','Pick-and-roll reads',85,4,{points:0,rebounds:0,assists:0},'t1')
    ]
  };
}
function blank(prev){return {sample:false,profile:prev?.profile?{...prev.profile}:{name:'',school:'',grade:'',sport:'basketball',position:'',jersey:''},theme:prev?.theme||'system',teams:[],logs:[]}}

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.logs)S=sample();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const UI={tab:'home',sport:null,type:'all',metric:null,achFilter:'all'};
const validTabs=['home','teams','stats','awards','profile'];
if(validTabs.includes(location.hash.slice(1)))UI.tab=location.hash.slice(1);

function applyTheme(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else r.removeAttribute('data-theme')}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* ---------- derived data ---------- */
const sportsUsed=()=>{const s=new Set(S.logs.map(l=>l.sport));S.teams.filter(t=>t.joined).forEach(t=>s.add(t.sport));s.add(S.profile.sport||'basketball');return Object.keys(SPORTS).filter(k=>s.has(k))};
const curSport=()=>{const u=sportsUsed();if(!UI.sport||!u.includes(UI.sport))UI.sport=u.includes(S.profile.sport)?S.profile.sport:u[0];return UI.sport};
const sorted=arr=>[...arr].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
const initials=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const myTeams=()=>S.teams.filter(t=>t.joined);

function summary(sport,type='all'){
  const logs=S.logs.filter(l=>l.sport===sport&&(type==='all'||l.type===type));
  const matches=logs.filter(l=>l.type==='match');
  const wins=matches.filter(l=>l.result==='W').length;
  const unit=SPORTS[sport].unit;
  const avg=matches.length?matches.reduce((s,l)=>s+(+l.stats?.[unit]||0),0)/matches.length:0;
  return {logs,matches,practices:logs.filter(l=>l.type==='practice'),wins,winRate:matches.length?Math.round(wins/matches.length*100):null,avg,minutes:logs.reduce((s,l)=>s+(+l.minutes||0),0)};
}
function records(sport){
  return SPORTS[sport].fields.map(([k,lab])=>{
    let best=null;S.logs.filter(l=>l.sport===sport&&l.type==='match').forEach(l=>{const v=+l.stats?.[k]||0;if(!best||v>best.v)best={v,l}});
    return {k,lab,best};
  });
}

function achievements(){
  const L=sorted(S.logs).reverse();
  const matches=L.filter(l=>l.type==='match');
  const tot=(sp,k)=>L.filter(l=>l.type==='match'&&(!sp||l.sport===sp)).reduce((s,l)=>s+(+l.stats?.[k]||0),0);
  let streak=0;Object.keys(SPORTS).forEach(sp=>{let c=0;matches.filter(m=>m.sport===sp).forEach(m=>{c=m.result==='W'?c+1:0;streak=Math.max(streak,c)})});
  const mins=L.reduce((s,l)=>s+(+l.minutes||0),0);
  const dateWhen=(pred,need)=>{let c=0;for(const l of L){c+=pred(l);if(c>=need)return l.date}return null};
  const A=[
    ['First whistle','Log your first session.','flag',L.length,1,'sessions',null],
    ['Showing up','Log 10 sessions, practice or match.','pulse',L.length,10,'sessions',null],
    ['Grinder','Log 5 practice sessions.','cone',L.filter(l=>l.type==='practice').length,5,'practices',null],
    ['Taste of victory','Record your first win.','trophy',matches.filter(m=>m.result==='W').length,1,'wins',null],
    ['Winning ways','Record 10 wins in any sport.','trophy',matches.filter(m=>m.result==='W').length,10,'wins',null],
    ['On a roll','Win 3 matches in a row in the same sport.','flame',streak,3,'straight wins',null],
    ['Putting in the time','Log 300 minutes of play and practice.','clock',mins,300,'minutes',null],
    ['Built to last','Reach 1,000 logged minutes.','shield',mins,1000,'minutes',null],
    ['Team player','Record 25 assists across sports.','teams',tot(null,'assists'),25,'assists',null],
    ['Century scorer','Score 100 basketball points in matches.','target',tot('basketball','points'),100,'points','Basketball'],
    ['Clinical finisher','Score 10 football goals in matches.','target',tot('football','goals'),10,'goals','Football'],
    ['Above the net','Record 50 volleyball kills in matches.','target',tot('volleyball','kills'),50,'kills','Volleyball'],
    ['Squad up','Join 2 school teams.','teams',myTeams().length,2,'teams',null],
    ['All-rounder','Log sessions in 2 different sports.','star',new Set(L.map(l=>l.sport)).size,2,'sports',null]
  ];
  return A.map(([name,desc,icon,have,need,unit,sport])=>({name,desc,icon,have:Math.min(have,need),need,unit,sport,done:have>=need,pct:Math.min(100,Math.round(have/need*100))}));
}

/* ---------- pieces ---------- */
function sportChips(){return `<div class="chips" role="group" aria-label="Sport">${sportsUsed().map(k=>`<button class="chip" data-act="sport" data-v="${k}" aria-pressed="${k===curSport()}">${SPORTS[k].name}</button>`).join('')}</div>`}
function kpis(sp,type){
  const s=summary(sp,type),u=SPORTS[sp].unit;
  const t=(icon,lab,val,suf='')=>`<div class="card kpi"><div class="lab">${ic(icon,16)}${lab}</div><div class="val">${val}${suf?`<small>${suf}</small>`:''}</div></div>`;
  return `<div class="kpis">
    ${t('pulse','Sessions',s.logs.length,`${s.matches.length} M · ${s.practices.length} P`)}
    ${t('trophy','Win rate',s.winRate==null?'–':s.winRate+'%')}
    ${t('target','Avg. '+u,s.matches.length?s.avg.toFixed(1):'–','/ match')}
    ${t('clock','Time logged',s.minutes,'min')}
  </div>`;
}
function chart(sp){
  const fields=[...SPORTS[sp].fields,['minutes','Minutes']];
  if(!UI.metric||!fields.some(f=>f[0]===UI.metric))UI.metric=SPORTS[sp].unit;
  const k=UI.metric, lab=fields.find(f=>f[0]===k)[1];
  const src=k==='minutes'?S.logs.filter(l=>l.sport===sp&&(UI.type==='all'||l.type===UI.type)):S.logs.filter(l=>l.sport===sp&&l.type==='match');
  const pts=sorted(src).reverse().slice(-10).map(l=>({d:l.date,v:k==='minutes'?+l.minutes||0:+l.stats?.[k]||0,p:l.type==='practice'}));
  const avg=pts.length?pts.reduce((s,p)=>s+p.v,0)/pts.length:0;
  const head=`<div class="charthead"><div><h2>Performance trend</h2><div class="small muted">${k==='minutes'?'Minutes per session':lab+' per match'} · last ${pts.length||0}</div></div>
    <select class="mini" id="metricSel" aria-label="Metric">${fields.map(([fk,fl])=>`<option value="${fk}" ${fk===k?'selected':''}>${fl}</option>`).join('')}</select></div>`;
  if(pts.length<2)return `<div class="card pad chart">${head}<div class="empty"><b>Not enough data yet</b>Log at least two ${k==='minutes'?'sessions':'matches'} to see a trend.</div></div>`;
  const W=320,H=150,L=30,R=10,T=10,B=24;
  const raw=Math.max(...pts.map(p=>p.v),1);const step=raw<=5?1:raw<=12?3:raw<=30?6:raw<=60?15:raw<=120?30:Math.ceil(raw/4/10)*10;
  const max=Math.ceil(raw/step)*step;
  const x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[];for(let v=0;v<=max;v+=step)ticks.push(v);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z`;
  const showLab=i=>pts.length<=6||i===0||i===pts.length-1||i===Math.floor((pts.length-1)/2);
  return `<div class="card pad chart">${head}
    <div style="margin-top:8px"><span class="big">${avg.toFixed(1)}</span> <span class="small muted">avg. ${k==='minutes'?'min':lab.toLowerCase()}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(lab)} trend over the last ${pts.length} entries">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
      ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join('')}
      <path d="${area}" fill="url(#ag)"/>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
      ${pts.map((p,i)=>{const last=i===pts.length-1;return `<circle cx="${x(i)}" cy="${y(p.v)}" r="${last?4.5:3}" fill="${last?'var(--accent)':'var(--surface)'}" stroke="${p.p?'var(--warn)':'var(--accent)'}" stroke-width="2"/>`}).join('')}
      ${pts.map((p,i)=>showLab(i)?`<text class="axis" x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${fmtDate(p.d)}</text>`:'').join('')}
    </svg></div>`;
}
function logRow(l){
  const sp=SPORTS[l.sport],u=sp.unit;
  if(l.type==='match'){
    return `<button class="row" data-act="openLog" data-id="${l.id}"><span class="glyph">${ic('shield')}</span>
      <span style="min-width:0"><div class="t">vs. ${esc(l.opponent||'Opponent')}</div><div class="m num">${fmtDate(l.date)} · ${l.us??'–'}–${l.them??'–'} · ${sp.name}</div></span>
      <span class="r"><b>${+l.stats?.[u]||0}<small>${u}</small></b><span class="pill ${l.result}">${{W:'Win',L:'Loss',D:'Draw'}[l.result]}</span></span></button>`;
  }
  return `<button class="row" data-act="openLog" data-id="${l.id}"><span class="glyph prac">${ic('cone')}</span>
    <span style="min-width:0"><div class="t">${esc(l.focus||'Practice')}</div><div class="m num">${fmtDate(l.date)} · ${l.minutes||0} min · ${sp.name}</div></span>
    <span class="r"><b>${'●'.repeat(l.rating||0)}<small style="opacity:.5">${'●'.repeat(5-(l.rating||0))}</small></b><span class="pill P">Practice</span></span></button>`;
}
function teamCard(t){
  const mine=S.logs.filter(l=>l.teamId===t.id).length;
  return `<button class="card team" data-act="openTeam" data-id="${t.id}"><span class="glyph">${ic('shield',24)}</span>
    <span style="min-width:0"><div style="font-weight:800;font-size:16px">${esc(t.name)}</div>
    <div class="small muted">${SPORTS[t.sport].name} · ${esc(t.level)} · ${t.roster.length} players</div>
    ${t.joined?`<div class="small" style="margin-top:6px;color:var(--accent);font-weight:600">${mine} of your sessions logged here</div>`:''}</span>
    <span class="avatars">${t.roster.slice(0,3).map(n=>`<span>${initials(n)}</span>`).join('')}</span></button>`;
}
function sampleBadge(){return S.sample?`<span class="pill n" style="margin-bottom:14px">Sample data · <button class="link" style="padding:0;font-size:11px" data-act="startFresh">Start fresh</button></span>`:''}

/* ---------- views ---------- */
function vHome(){
  const sp=curSport(),first=(S.profile.name||'').split(' ')[0];
  const recent=sorted(S.logs).slice(0,3);
  const A=achievements(),done=A.filter(a=>a.done).length,next=A.filter(a=>!a.done).sort((a,b)=>b.pct-a.pct)[0];
  return `<h1>${first?`Let’s make progress, ${esc(first)}.`:'Let’s make progress.'}</h1>
  <p class="sub">${esc(S.profile.school||'Your school')}${S.profile.grade?' · '+esc(S.profile.grade):''}</p>
  ${sampleBadge()}
  <div class="stack">${sportChips()}${kpis(sp,'all')}${chart(sp)}
  <div class="grid2"><button class="btn primary" data-act="log" data-v="match">${ic('plus',18)}Log a match</button><button class="btn" data-act="log" data-v="practice">${ic('cone',18)}Log practice</button></div></div>
  <section class="sec"><div class="sechead"><h2>Recent sessions</h2><button class="link" data-act="tab" data-tab="stats">See all</button></div>
    <div class="card list">${recent.length?recent.map(logRow).join(''):`<div class="empty"><b>No sessions yet</b>Log a match or a practice to start your record.</div>`}</div></section>

    ${myTeams().length?myTeams().map(teamCard).join(''):`<div class="card empty"><b>You haven’t joined a team</b>Ask your coach for an invite code, or browse your school’s teams.</div>`}</section>
  <section class="sec"><button class="callout" data-act="tab" data-tab="awards" style="text-align:left;cursor:pointer;font:inherit;color:inherit">${ic('medal',30)}
    <span><b>${done} achievements unlocked</b><div class="small muted">${next?`Up next: ${next.name} · ${next.have} / ${next.need} ${next.unit}`:'You’ve unlocked everything.'}</div></span></button></section>`;
}
function vStats(){
  const sp=curSport();
  const logs=sorted(S.logs.filter(l=>l.sport===sp&&(UI.type==='all'||l.type===UI.type)));
  const prs=records(sp);
  return `<h1>Your game, in numbers.</h1><p class="sub">Track the work. See the improvement.</p>${sampleBadge()}
  <div class="stack">${sportChips()}
  <div class="seg" role="group" aria-label="Session type">${[['all','All'],['match','Matches'],['practice','Practice']].map(([k,l])=>`<button data-act="type" data-v="${k}" aria-pressed="${UI.type===k}">${l}</button>`).join('')}</div>
  ${kpis(sp,UI.type)}${chart(sp)}</div>
  <section class="sec"><div class="sechead"><h2>Personal records</h2><span class="small muted">best single match</span></div>
    <div class="prs">${prs.map(p=>`<div class="card pr"><div class="eyebrow">${p.lab}</div><div class="v">${p.best?p.best.v:'–'}</div><div class="d">${p.best?`vs. ${esc(p.best.l.opponent)} · ${fmtDate(p.best.l.date)}`:'No matches yet'}</div></div>`).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Session log</h2><span class="small muted num">${logs.length} entries</span></div>
    <div class="card list">${logs.length?logs.map(logRow).join(''):`<div class="empty"><b>Nothing logged here yet</b>Use the buttons below to add a ${UI.type==='practice'?'practice':'match'}.</div>`}</div>
    <div class="grid2"><button class="btn primary" data-act="log" data-v="match">${ic('plus',18)}Log a match</button><button class="btn" data-act="log" data-v="practice">${ic('cone',18)}Log practice</button></div></section>`;
}
function vTeams(){
  const others=S.teams.filter(t=>!t.joined);
  return `<h1>Better together.</h1><p class="sub">Teams at ${esc(S.profile.school||'your school')}.</p>
  <div class="grid2"><button class="btn primary" data-act="joinCode">${ic('key',18)}Join with a code</button><button class="btn" data-act="createTeam">${ic('plus',18)}Create a team</button></div>
  <section class="sec"><h2>My teams <span class="muted small num">${myTeams().length}</span></h2>
    ${myTeams().length?myTeams().map(teamCard).join(''):`<div class="card empty"><b>No teams yet</b>Join one below or enter your coach’s invite code.</div>`}</section>

    ${others.length?others.map(teamCard).join(''):`<div class="card empty">You’re on every team listed for your school.</div>`}</section>`;
}

  const A=achievements(),done=A.filter(a=>a.done).length,next=A.filter(a=>!a.done).sort((a,b)=>b.pct-a.pct)[0];
  const list=A.filter(a=>UI.achFilter==='all'||(UI.achFilter==='done')===a.done);
  return `<h1>Your effort. Recognized.</h1><p class="sub">Milestones update automatically from what you log.</p>
  <div class="stack">
  <div class="card pad"><div style="display:flex;gap:12px;align-items:center"><span style="color:var(--accent)">${ic('medal',30)}</span><div><span class="big">${done}</span> <span class="muted">/ ${A.length} unlocked</span></div></div><div class="bar"><i style="width:${Math.round(done/A.length*100)}%"></i></div></div>
  ${next?`<div class="card pad"><div class="eyebrow">Next within reach</div><div style="font-weight:800;font-size:17px;margin-top:4px">${next.name}</div><div class="small muted">${next.desc} ${next.need-next.have} ${next.unit} to go.</div></div>`:''}

  ${list.map(a=>`<div class="card ach ${a.done?'done':''}"><span class="glyph">${ic(a.icon,24)}</span><div>
    <div class="eyebrow">${a.sport||'All sports'}</div><div style="font-weight:800">${a.name}</div><div class="small muted">${a.desc}</div>

  </div></div>`).join('')}</div>`;
}

/* ---------- modals ---------- */
let modalCtx=null;
function openModal(html,ctx){modalCtx=ctx||null;const m=document.getElementById('modal');m.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=m.querySelector('input,select,textarea,button:not([data-act="close"])');f&&f.focus()}
function closeModal(){document.getElementById('modal').innerHTML='';modalCtx=null}
const sheetHead=t=>`<div class="sheethead"><h2>${t}</h2><button class="iconbtn" data-act="close" aria-label="Close">${ic('x',18)}</button></div>`;

  <form id="logForm" novalidate>

    <div class="grid2"><div class="f"><label for="lf-sport">Sport</label><select id="lf-sport" name="sport">${Object.entries(SPORTS).map(([k,s])=>`<option value="${k}" ${k===sp?'selected':''}>${s.name}</option>`).join('')}</select></div>

      <div class="f"><label for="lf-opp">Opponent</label><input id="lf-opp" name="opponent" value="${esc(l.opponent||'')}" placeholder="e.g. Seoul Knights"></div>
      <div class="grid3"><div class="f"><label for="lf-us">Our score</label><input id="lf-us" name="us" type="number" min="0" inputmode="numeric" value="${l.us??''}"></div>
        <div class="f"><label for="lf-them">Their score</label><input id="lf-them" name="them" type="number" min="0" inputmode="numeric" value="${l.them??''}"></div>
        <div class="f"><label for="lf-res">Result</label><select id="lf-res" name="result">${[['W','Win'],['L','Loss'],['D','Draw']].map(([k,v])=>`<option value="${k}" ${l.result===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`
    :`<div class="f"><label for="lf-focus">What did you work on?</label><input id="lf-focus" name="focus" value="${esc(l.focus||'')}" placeholder="e.g. Free throws, 100 reps"></div>
      <div class="f"><label>How did it go?</label><div class="rating" role="group" aria-label="Session rating, 1 to 5">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-v="${n}" aria-pressed="${(l.rating||3)===n}">${n}</button>`).join('')}</div></div>`}
    <div class="grid3">${SPORTS[sp].fields.map(([k,lab])=>`<div class="f"><label for="lf-${k}">${lab}</label><input id="lf-${k}" name="s_${k}" type="number" min="0" inputmode="numeric" value="${l.stats?.[k]??0}"></div>`).join('')}</div>
    <div class="grid2"><div class="f"><label for="lf-min">Minutes</label><input id="lf-min" name="minutes" type="number" min="0" inputmode="numeric" value="${l.minutes??''}"></div>
      <div class="f"><label for="lf-team">Team</label><select id="lf-team" name="teamId"><option value="">No team</option>${teamOpts.map(t=>`<option value="${t.id}" ${l.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>
    <div class="f"><label for="lf-notes">Notes</label><textarea id="lf-notes" name="notes" placeholder="What went well? What will you work on next?">${esc(l.notes||'')}</textarea></div>
    <div id="lf-err" class="err" hidden></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${existing?'Save changes':type==='match'?'Save match':'Save practice'}</button></div>
  </form>`,{kind:'log',type,rating:l.rating||3,editId:existing?.id});
}
function readLogForm(){
  const f=document.getElementById('logForm');const fd=new FormData(f);const sp=fd.get('sport');
  const stats={};SPORTS[sp].fields.forEach(([k])=>stats[k]=Math.max(0,+fd.get('s_'+k)||0));
  const o={type:modalCtx.type,sport:sp,date:fd.get('date')||today(),minutes:Math.max(0,+fd.get('minutes')||0),stats,teamId:fd.get('teamId')||'',notes:(fd.get('notes')||'').trim()};
  if(o.type==='match'){o.opponent=(fd.get('opponent')||'').trim();o.us=fd.get('us')===''?null:+fd.get('us');o.them=fd.get('them')===''?null:+fd.get('them');o.result=fd.get('result')}
  else{o.focus=(fd.get('focus')||'').trim();o.rating=modalCtx.rating}
  return o;
}
function logDetail(id){
  const l=S.logs.find(x=>x.id===id);if(!l)return;const sp=SPORTS[l.sport];const team=S.teams.find(t=>t.id===l.teamId);
  openModal(`${sheetHead(l.type==='match'?'vs. '+esc(l.opponent||'Opponent'):esc(l.focus||'Practice'))}
    <div class="stack"><div style="display:flex;gap:8px;flex-wrap:wrap">${l.type==='match'?`<span class="pill ${l.result}">${{W:'Win',L:'Loss',D:'Draw'}[l.result]}</span>`:`<span class="pill P">Practice</span>`}<span class="pill n">${sp.name}</span>${team?`<span class="pill a">${esc(team.name)}</span>`:''}</div>
    <dl class="kv"><dt>Date</dt><dd>${new Date(l.date+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'})}</dd>
      ${l.type==='match'?`<dt>Final score</dt><dd>${l.us??'–'} – ${l.them??'–'}</dd>`:`<dt>Session rating</dt><dd>${l.rating} / 5</dd>`}
      <dt>Minutes</dt><dd>${l.minutes||0}</dd>
      ${sp.fields.map(([k,lab])=>`<dt>${lab}</dt><dd>${+l.stats?.[k]||0}</dd>`).join('')}</dl>
    ${l.notes?`<div class="card pad small" style="box-shadow:none;background:var(--surface2)">${esc(l.notes)}</div>`:''}
    <div id="delZone" class="actions"><button class="btn danger" data-act="delAsk">Delete</button><button class="btn primary" data-act="editLog" data-id="${l.id}">Edit</button></div></div>`,{kind:'detail',id});
}
function teamDetail(id){
  const t=S.teams.find(x=>x.id===id);if(!t)return;
  const mine=sorted(S.logs.filter(l=>l.teamId===t.id));
  openModal(`${sheetHead(esc(t.name))}<div class="stack">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill a">${SPORTS[t.sport].name}</span><span class="pill n">${esc(t.level)}</span>${t.joined?'<span class="pill W">Member</span>':''}</div>
    <dl class="kv"><dt>Coach</dt><dd>${esc(t.coach)}</dd><dt>Meets</dt><dd>${esc(t.meets)}</dd><dt>Players</dt><dd>${t.roster.length}</dd></dl>
    ${t.joined?`<div class="card pad" style="box-shadow:none;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="eyebrow">Invite code</div><div class="code">${t.code}</div></div><button class="btn sm" data-act="copy" data-v="${t.code}">${ic('copy',16)}Copy</button></div>`:''}
    <div><div class="eyebrow" style="margin-bottom:8px">Roster</div><div class="card list" style="box-shadow:none">${t.roster.map(n=>`<div class="row" style="cursor:default;grid-template-columns:32px 1fr"><span class="avatars"><span style="width:32px;height:32px;font-size:11px">${initials(n)}</span></span><span>${esc(n)}${n===S.profile.name?' <span class="muted small">(you)</span>':''}</span></div>`).join('')}</div></div>
    ${t.joined&&mine.length?`<div><div class="eyebrow" style="margin-bottom:8px">Your sessions with ${esc(t.name)}</div><div class="card list" style="box-shadow:none">${mine.slice(0,4).map(logRow).join('')}</div></div>`:''}
    ${t.joined?`<button class="btn block danger" data-act="leave" data-id="${t.id}">Leave team</button>`:`<div class="small muted">Ask ${esc(t.coach)} for the invite code to join this team.</div><button class="btn block primary" data-act="joinCode">${ic('key',18)}Enter invite code</button>`}
  </div>`,{kind:'team',id});
}

/* ---------- render ---------- */
const VIEWS={home:vHome,teams:vTeams,stats:vStats,awards:vAwards,profile:vProfile};
function render(){
  applyTheme();
  document.getElementById('view').innerHTML=VIEWS[UI.tab]();
  document.getElementById('avatarBtn').textContent=initials(S.profile.name);
  document.getElementById('tabs').innerHTML=validTabs.map(k=>`<button data-act="tab" data-tab="${k}" ${UI.tab===k?'aria-current="page"':''}>${ic(k,22)}${k[0].toUpperCase()+k.slice(1)}</button>`).join('');
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='scrim'){if(e.target===b)closeModal();return}
  switch(a){
    case 'tab':UI.tab=b.dataset.tab;closeModal();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+UI.tab)}catch(_){}break;
    case 'sport':UI.sport=v;UI.metric=null;render();break;
    case 'type':UI.type=v;render();break;
    case 'achF':UI.achFilter=v;render();break;
    case 'theme':S.theme=v;save();render();break;
    case 'log':logForm(v);break;
    case 'close':closeModal();break;
    case 'logType':{const cur=readLogForm();cur.type=v;const ed=modalCtx.editId;if(ed){cur.id=ed;logForm(v,cur)}else logForm(v,null,cur);break}
    case 'rate':modalCtx.rating=+v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'openLog':logDetail(b.dataset.id);break;
    case 'editLog':logForm(null,S.logs.find(l=>l.id===b.dataset.id));break;
    case 'delAsk':document.getElementById('delZone').innerHTML=`<span class="small muted" style="margin-right:auto;align-self:center">Delete this session?</span><button class="btn" data-act="close">Keep</button><button class="btn danger" data-act="delYes">Delete</button>`;break;
    case 'delYes':S.logs=S.logs.filter(l=>l.id!==modalCtx.id);save();closeModal();render();toast('Session deleted');break;
    case 'openTeam':teamDetail(b.dataset.id);break;
    case 'leave':{const t=S.teams.find(x=>x.id===b.dataset.id);t.joined=false;save();closeModal();render();toast('Left '+t.name);break}
    case 'copy':navigator.clipboard?.writeText(v).then(()=>toast('Code copied'),()=>toast('Select the code to copy it'));break;
    case 'joinCode':openModal(`${sheetHead('Join with a code')}<form id="joinForm" novalidate><p class="small muted" style="margin:0">Your coach or team captain can find the code on their team page.</p>
      <div class="f"><label for="jc">Invite code</label><input id="jc" name="code" autocomplete="off" autocapitalize="characters" placeholder="e.g. SPIKE4" style="text-transform:uppercase;letter-spacing:.1em;font-weight:700"></div>
      <div id="jc-err" class="err" hidden></div><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Join team</button></div></form>`,{kind:'join'});break;
    case 'createTeam':openModal(`${sheetHead('Create a team')}<form id="teamForm" novalidate>
      <div class="f"><label for="tf-name">Team name</label><input id="tf-name" name="name" placeholder="e.g. Hanseo Lady Jets"></div>
      <div class="grid2"><div class="f"><label for="tf-sport">Sport</label><select id="tf-sport" name="sport">${Object.entries(SPORTS).map(([k,s])=>`<option value="${k}">${s.name}</option>`).join('')}</select></div>
      <div class="f"><label for="tf-level">Level</label><select id="tf-level" name="level"><option>Varsity</option><option>Junior varsity</option><option>Club</option><option>Intramural</option></select></div></div>
      <div class="f"><label for="tf-meets">When and where do you meet?</label><input id="tf-meets" name="meets" placeholder="e.g. Tue · Thu, 4:00 pm · Gym B"></div>
      <div id="tf-err" class="err" hidden></div><div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Create team</button></div></form>`,{kind:'create'});break;
    case 'editProfile':{const P=S.profile;openModal(`${sheetHead('Edit profile')}<form id="profForm" novalidate>
      <div class="f"><label for="pf-name">Name</label><input id="pf-name" name="name" value="${esc(P.name)}"></div>
      <div class="grid2"><div class="f"><label for="pf-school">School</label><input id="pf-school" name="school" value="${esc(P.school)}"></div><div class="f"><label for="pf-grade">Grade</label><input id="pf-grade" name="grade" value="${esc(P.grade)}" placeholder="Grade 10"></div></div>
      <div class="grid3"><div class="f"><label for="pf-sport">Main sport</label><select id="pf-sport" name="sport">${Object.entries(SPORTS).map(([k,s])=>`<option value="${k}" ${k===P.sport?'selected':''}>${s.name}</option>`).join('')}</select></div>
      <div class="f"><label for="pf-pos">Position</label><input id="pf-pos" name="position" value="${esc(P.position)}"></div><div class="f"><label for="pf-jersey">Jersey #</label><input id="pf-jersey" name="jersey" inputmode="numeric" value="${esc(P.jersey)}"></div></div>
      <div class="actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary">Save profile</button></div></form>`,{kind:'profile'});break}
    case 'startFresh':openModal(`${sheetHead('Start fresh?')}<div class="stack"><p style="margin:0">This removes every session and team in this browser. Your profile stays. This can’t be undone.</p><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="freshYes">Remove everything</button></div></div>`);break;
    case 'freshYes':{S=blank(S.sample?{profile:{...S.profile,name:'',school:'',grade:'',position:'',jersey:''},theme:S.theme}:S);save();closeModal();UI.tab='profile';render();toast('Cleared. Add your profile to begin.');break}
    case 'loadSample':{const th=S.theme;S=sample();S.theme=th;save();render();toast('Sample data loaded');break}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='metricSel'){UI.metric=e.target.value;render()}
  if(e.target.id==='lf-sport'){const cur=readLogForm();cur.teamId='';cur.stats={};const ed=modalCtx.editId;if(ed){cur.id=ed;logForm(cur.type,cur)}else logForm(cur.type,null,cur)}
  if(e.target.id==='lf-us'||e.target.id==='lf-them'){const u=document.getElementById('lf-us').value,t=document.getElementById('lf-them').value;if(u!==''&&t!=='')document.getElementById('lf-res').value=+u>+t?'W':+u<+t?'L':'D'}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='logForm'){
    const o=readLogForm(),err=document.getElementById('lf-err');
    if(o.type==='match'&&!o.opponent){err.textContent='Add the opponent’s name so you can find this match later.';err.hidden=false;return}
    if(o.type==='practice'&&!o.focus){err.textContent='Add what you worked on, even a few words like “shooting drills”.';err.hidden=false;return}
    if(modalCtx.editId){const i=S.logs.findIndex(l=>l.id===modalCtx.editId);S.logs[i]={...S.logs[i],...o}}else S.logs.push({id:uid(),...o});
    UI.sport=o.sport;save();closeModal();render();toast(o.type==='match'?'Match saved':'Practice saved');
  }
  if(id==='joinForm'){
    const code=(new FormData(e.target).get('code')||'').trim().toUpperCase(),err=document.getElementById('jc-err');
    const t=S.teams.find(x=>x.code===code);
    if(!t){err.textContent='No team at your school uses that code. Check it with your coach and try again.';err.hidden=false;return}
    if(t.joined){err.textContent=`You’re already on ${t.name}.`;err.hidden=false;return}
    t.joined=true;if(S.profile.name&&!t.roster.includes(S.profile.name))t.roster.unshift(S.profile.name);save();closeModal();UI.tab='teams';render();toast('Joined '+t.name);
  }
  if(id==='teamForm'){
    const fd=new FormData(e.target),name=(fd.get('name')||'').trim();
    if(!name){const er=document.getElementById('tf-err');er.textContent='Give your team a name.';er.hidden=false;return}
    const code=(name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||'TEAM')+Math.floor(10+Math.random()*90);
    const t={id:uid(),name,sport:fd.get('sport'),level:fd.get('level'),coach:S.profile.name||'You',meets:(fd.get('meets')||'').trim()||'Schedule not set',code,roster:[S.profile.name||'You'],joined:true};
    S.teams.push(t);save();closeModal();render();teamDetail(t.id);toast('Team created. Share the invite code.');
  }
  if(id==='profForm'){
    const fd=new FormData(e.target);['name','school','grade','sport','position','jersey'].forEach(k=>S.profile[k]=(fd.get(k)||'').trim());
    save();closeModal();render();toast('Profile saved');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').innerHTML)closeModal()});
render();
</script>
</body>
</html>
