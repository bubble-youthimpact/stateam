<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Stateam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f2f4f8;--surface:#fff;--line:#dce1ea;--fg:#0c1220;--muted:#5a6477;--accent:#2557d6;--font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#06080d;--surface:#10141c;--line:#242b38;--fg:#edf1f8;--muted:#8a94a7;--accent:#5b8cf5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--fg);text-decoration:none}
.brand svg{color:var(--accent)}
h1{font-size:32px;line-height:1.15;letter-spacing:-.03em;margin:28px 0 6px;text-wrap:balance}
h2{font-size:19px;margin:32px 0 8px;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:14px;margin:0}
p,li{max-width:65ch}
ul{padding-left:20px}
li{margin:4px 0}
a{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted);border-top:0}
.tw{overflow-x:auto}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/" id="brand"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 3v17h18"/><path d="M8 16v-4M12 16V7M16 16v-6M20 16v-9"/></svg>Stateam</a>
  <h1>Page not found</h1>
  <p>This page doesn’t exist. It may have moved, or the link may be mistyped.</p>
  <p><a href="./" id="home">Go to Stateam</a></p>
</div>
<script>(function(){var p=location.pathname.split('/').filter(Boolean);if(location.hostname.endsWith('github.io')&&p.length){var h='/'+p[0]+'/';document.getElementById('home').href=h;document.getElementById('brand').href=h}})();</script>
</body>
</html>
